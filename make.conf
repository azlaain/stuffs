MAKEOPTS="-j8 -l16"
EMERGE_DEFAULT_OPTS="--jobs=8 --load-average=15.0 --with-bdeps=y --keep-going --autounmask --autounmask-write --getbinpkg --quiet-build=y --rebuilt-binaries=n --verbose"




COMMON_FLAGS="-O2 -pipe"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"
KCFLAGS ="${COMMON_FLAGS}"







USE="X icu xorg -systemd openrc elogind -kde qml -gnome -wayland pam udev wifi firmware fbdev emacs"
USE="${USE} ogg opus -pulseaudio pipewire pipewire-alsa alsa sound-server jack jack-client openal opengl dbus qt6"









# NOTE: This stage was built with the bindist USE flag enabled

# This sets the language of build output to English.
# Please keep this setting intact when reporting bugs.
LC_MESSAGES=C.utf8
ACCEPT_KEYWORDS="~amd64"
VIDEO_CARDS="nvidia"
ACCEPT_LICENSE=*
